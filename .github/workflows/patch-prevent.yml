name: Patch PREVENT calculator
on:
  push:
    paths:
      - '.github/workflows/patch-prevent.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculators.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('calculators.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<a href="#ascvd">ASCVD/PREVENT</a>','<a href="#prevent">PREVENT</a>')
          s=s.replace('<a href="#ascvd">ASCVD / PREVENT</a>','<a href="#prevent">PREVENT</a>')
          s=s.replace('<a href="#ascvd">PREVENT</a>','<a href="#prevent">PREVENT</a>')
          start=s.find('<section class="calc" id="ascvd">')
          if start==-1:
              start=s.find('<section class="calc" id="prevent">')
          if start==-1:
              raise SystemExit('PREVENT section not found')
          end=s.find('</section>',start)
          if end==-1:
              raise SystemExit('PREVENT section end not found')
          end += len('</section>')
          new='''<section class="calc" id="prevent"><div class="calc-head"><div><h2>PREVENT</h2><p class="desc">American Heart Association PREVENT™ — оценка 10- и 30-летнего сердечно-сосудистого риска в первичной профилактике.</p></div><span class="badge">СС-РИСК</span></div><p class="interpret">PREVENT применяется у взрослых 30–79 лет без установленного сердечно-сосудистого заболевания. Базовая модель учитывает возраст, пол, САД, общий холестерин, ХС-ЛВП, ИМТ, сахарный диабет, курение, рСКФ, антигипертензивную и статиновую терапию; дополнительные модели могут учитывать UACR, HbA1c и SDI.</p><div style="border:1px solid #e5e9ef;border-radius:12px;overflow:hidden;background:#fff"><iframe src="https://professional.heart.org/en/guidelines-and-statements/prevent-calculator" title="AHA PREVENT calculator" style="width:100%;height:980px;border:0;display:block" loading="lazy"></iframe></div><div class="actions"><a href="https://professional.heart.org/en/guidelines-and-statements/prevent-calculator" target="_blank" rel="noopener" style="display:inline-block;padding:10px 14px;border-radius:8px;background:#172235;color:#fff;text-decoration:none;font-weight:700">Открыть официальный PREVENT в новой вкладке</a></div><p class="interpret"><b>Источник:</b> American Heart Association PREVENT™. Если браузер блокирует встроенное окно, используйте кнопку выше.</p></section>'''
          s=s[:start]+new+s[end:]
          s=s.replace('<b>ASCVD/PREVENT</b> — ACC/AHA.','<b>PREVENT</b> — American Heart Association.')
          s=s.replace('<b>ASCVD / PREVENT</b> — ACC/AHA.','<b>PREVENT</b> — American Heart Association.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculators.html
          git commit -m "Rename ASCVD PREVENT to PREVENT and activate official calculator"
          git push
