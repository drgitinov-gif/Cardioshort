name: Fix SVT back button
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-svt-back-button.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move SVT back button further left
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supraventricular-tachycardia.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('transform:translateX(-190px)', 'transform:translateX(-220px)')
          s=s.replace('@media(max-width:1200px){.back,.back:visited{transform:translateX(-70px)}}', '@media(max-width:1200px){.back,.back:visited{transform:translateX(-90px)}}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supraventricular-tachycardia.html
          git commit -m 'Move SVT back button further left'
          git push