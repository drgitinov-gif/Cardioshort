# Run 2026-08-26
name: Apply larger CardioShort emblem
on:
  push:
    paths:
      - '.github/workflows/apply-logo-size.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply logo size directly to HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          marker='''<style id="cardioshort-logo-size-override">\n.heart{width:80px!important;height:80px!important;flex:0 0 80px!important;font-size:44px!important;border-width:3px!important}\nheader a::before{width:80px!important;height:80px!important;flex:0 0 80px!important;font-size:44px!important;border-width:3px!important}\nheader{min-height:104px!important}\n@media(max-width:720px){.heart{width:64px!important;height:64px!important;flex-basis:64px!important;font-size:34px!important}header a::before{width:64px!important;height:64px!important;flex-basis:64px!important;font-size:34px!important}header{min-height:88px!important}}\n</style>'''
          changed=0
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if 'cardioshort-logo-size-override' in s:
                  continue
              if '</head>' in s:
                  s=s.replace('</head>', marker+'\n</head>', 1)
                  p.write_text(s, encoding='utf-8')
                  changed+=1
          print('updated', changed, 'HTML files')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet || git commit -m "Увеличить эмблему CardioShort напрямую на всех страницах"
          git push
