name: Embed Eliquis banner directly
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/embed-eliquis-ad.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed banner as data URI
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re
          img = Path('assets/eliquis-vte-ad-1600.jpg').read_bytes()
          assert img[:2] == b'\xff\xd8' and img[-2:] == b'\xff\xd9', 'Invalid JPEG markers'
          uri = 'data:image/jpeg;base64,' + base64.b64encode(img).decode('ascii')
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'(<section class="ad-block"[^>]*>.*?<img\s+src=")[^"]+("\s+alt="Эликвис \(апиксабан\): лечение острого эпизода ТГВ/ТЭЛА"[^>]*>)'
          ns, n = re.subn(pattern, lambda m: m.group(1)+uri+m.group(2), s, flags=re.S)
          if n != 1:
              raise SystemExit(f'Advertisement image replacement count: {n}')
          p.write_text(ns, encoding='utf-8')
          PY
      - name: Commit embedded banner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Embed Eliquis banner directly in homepage'
          git push
