name: Add DAPT description
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add clinical clarification and larger logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('calculators.html')
          s=p.read_text()
          text='Если стентирование проводилось на фоне развившегося инфаркта (а не планово по поводу стабильной стенокардии), в калькуляторе шкалы DAPT выбирается пункт <i>«Myocardial infarction at presentation»</i> (Инфаркт при поступлении/презентации).'
          if text not in s:
              marker='<section class="calc" id="dapt"><div class="calc-head"><div><h2>DAPT score</h2><p class="desc">Оценка соотношения пользы и риска продления ДАТТ.</p></div><span class="badge">ДАТТ</span></div>'
              if marker not in s:
                  raise SystemExit('DAPT marker not found')
              s=s.replace(marker, marker+'<p class="interpret"><b>Пояснение:</b> '+text+'</p>', 1)
              p.write_text(s)

          logo_style='''<style id="cardioshort-logo-size-override">\n.heart{width:80px!important;height:80px!important;flex:0 0 80px!important;font-size:44px!important;border-width:3px!important}\nheader a::before{width:80px!important;height:80px!important;flex:0 0 80px!important;font-size:44px!important;border-width:3px!important}\nheader{min-height:104px!important}\n@media(max-width:720px){.heart{width:64px!important;height:64px!important;flex-basis:64px!important;font-size:34px!important}header a::before{width:64px!important;height:64px!important;flex-basis:64px!important;font-size:34px!important}header{min-height:88px!important}}\n</style>'''
          changed=0
          for f in Path('.').glob('*.html'):
              html=f.read_text(encoding='utf-8')
              if 'cardioshort-logo-size-override' not in html and '</head>' in html:
                  html=html.replace('</head>',logo_style+'\n</head>',1)
                  f.write_text(html,encoding='utf-8')
                  changed+=1
          print('logo override added to',changed,'pages')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet || (git commit -m "Увеличить эмблему CardioShort напрямую на всех страницах" && git push)
