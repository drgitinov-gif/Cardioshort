name: Integrate detailed HFA-PEFF
on:
  push:
    paths: ['.github/workflows/patch-hfa-peff.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace HFA-PEFF calculator
        shell: python
        run: |
          from pathlib import Path
          p=Path('calculators.html')
          s=p.read_text()
          a=s.index('<section class="calc" id="peff">')
          b=s.index('</section>',a)+len('</section>')
          new='''<section class="calc" id="peff"><div class="calc-head"><div><h2>HFA-PEFF</h2><p class="desc">Пошаговый алгоритм диагностики СН с сохранённой ФВ (HFpEF): функциональный, морфологический и биомаркерный домены.</p></div><span class="badge">HFpEF</span></div><p class="interpret"><b>Как считать:</b> в каждом из 3 доменов большой критерий = 2 балла, малый = 1 балл. Внутри одного домена баллы не суммируются: максимум 2 балла на домен, максимум 6 баллов всего. Заполните доступные параметры — калькулятор сам определит критерии.</p><div class="fields"><div class="field"><label>Ритм</label><select id="pfRh"><option value="sr">Синусовый ритм</option><option value="af">Фибрилляция предсердий</option></select></div><div class="field"><label>Возраст, лет</label><input id="pfAge" type="number" min="18" max="110"></div></div><h3>1. Функциональный домен</h3><div class="fields"><div class="field"><label>Септальная e′, см/с</label><p class="hint">Большой критерий: &lt;7 при возрасте &lt;75 лет; &lt;5 при ≥75 лет.</p><input id="pfSep" type="number" step="0.1"></div><div class="field"><label>Латеральная e′, см/с</label><p class="hint">Большой критерий: &lt;10 при возрасте &lt;75 лет; &lt;7 при ≥75 лет.</p><input id="pfLat" type="number" step="0.1"></div><div class="field"><label>Среднее E/e′</label><p class="hint">Большой ≥15; малый 9–14.</p><input id="pfEe" type="number" step="0.1"></div><div class="field"><label>Скорость ТР, м/с</label><p class="hint">Большой критерий &gt;2,8 м/с (соответствует СДЛА &gt;35 мм рт. ст.).</p><input id="pfTr" type="number" step="0.1"></div><div class="field"><label>GLS ЛЖ, % (абсолютное значение)</label><p class="hint">Малый критерий: GLS &lt;16%.</p><input id="pfGls" type="number" step="0.1"></div></div><h3>2. Морфологический домен</h3><div class="fields"><div class="field"><label>ИОЛП (LAVI), мл/м²</label><p class="hint">Синусовый ритм: большой &gt;34, малый 29–34. ФП: большой &gt;40, малый 34–40.</p><input id="pfLavi" type="number" step="0.1"></div><div class="field"><label>Пол</label><select id="pfSex"><option value="m">Мужчина</option><option value="f">Женщина</option></select></div><div class="field"><label>ИММЛЖ (LVMI), г/м²</label><p class="hint">Большой при сочетании с ОТС &gt;0,42: ≥149 у мужчин или ≥122 у женщин. Малый: ≥115 у мужчин или ≥95 у женщин.</p><input id="pfLvmi" type="number" step="0.1"></div><div class="field"><label>ОТС (RWT)</label><p class="hint">Относительная толщина стенок. &gt;0,42 участвует в большом морфологическом критерии; изолированно может соответствовать малому.</p><input id="pfRwt" type="number" step="0.01"></div><div class="field"><label>Толщина стенки ЛЖ, мм</label><p class="hint">Малый критерий: ≥12 мм.</p><input id="pfWall" type="number" step="0.1"></div></div><h3>3. Биомаркерный домен</h3><div class="fields"><div class="field"><label>Маркер</label><select id="pfMarker"><option value="nt">NT-proBNP, пг/мл</option><option value="bnp">BNP, пг/мл</option></select></div><div class="field"><label>Значение</label><input id="pfNp" type="number" step="1"><p class="hint">Пороги зависят от ритма: при ФП они выше.</p></div></div><div class="actions"><button onclick="peff()">Рассчитать HFA-PEFF</button><button class="clear" onclick="clearCalc('peff','peRes')">Очистить</button></div><div id="peRes" class="res">Введите доступные параметры пациента.</div><p class="interpret"><b>Интерпретация:</b> 0–1 — HFpEF маловероятна, искать альтернативные причины симптомов; 2–4 — промежуточная вероятность, показано функциональное тестирование (диастолическая стресс-ЭхоКГ и/или инвазивная гемодинамика при нагрузке); 5–6 — диагноз HFpEF высоко вероятен/подтверждается алгоритмом. После подтверждения следует определить возможную специфическую этиологию.</p><p class="interpret"><b>Важно:</b> повышенные натрийуретические пептиды поддерживают диагноз, но нормальные значения сами по себе HFpEF не исключают, особенно при ожирении. Алгоритм применяется после предварительной клинической оценки симптомов, факторов риска, ЭКГ/ЭхоКГ и исключения значимой клапанной патологии, ишемии и очевидных некардиальных причин одышки.</p></section>'''
          s=s[:a]+new+s[b:]
          f0=s.index('function peff(){')
          f1=s.index('function h2fpef',f0)
          fn='''function peff(){let age=v('pfAge'),rh=document.getElementById('pfRh').value,sex=document.getElementById('pfSex').value,sep=v('pfSep'),lat=v('pfLat'),ee=v('pfEe'),tr=v('pfTr'),gls=v('pfGls'),lavi=v('pfLavi'),lvmi=v('pfLvmi'),rwt=v('pfRwt'),wall=v('pfWall'),marker=document.getElementById('pfMarker').value,np=v('pfNp');let F=0,M=0,B=0,fd=[],md=[],bd=[];let emaj=false;if(age){emaj=(sep>0&&sep<(age>=75?5:7))||(lat>0&&lat<(age>=75?7:10));}if(emaj)fd.push('сниженная e′ (большой)');if(ee>=15)fd.push('E/e′ ≥15 (большой)');if(tr>2.8)fd.push('ТР >2,8 м/с (большой)');if(fd.length)F=2;else{if(ee>=9&&ee<15){F=1;fd.push('E/e′ 9–14 (малый)')}if(gls>0&&gls<16){F=1;fd.push('GLS <16% (малый)')}}let laviMaj=lavi>(rh==='af'?40:34),laviMin=lavi>=(rh==='af'?34:29)&&!laviMaj;let lvMaj=rwt>0.42&&lvmi>=(sex==='m'?149:122);if(laviMaj)md.push('увеличение ИОЛП (большой)');if(lvMaj)md.push('ОТС >0,42 + повышенный ИММЛЖ (большой)');if(md.length)M=2;else{if(laviMin){M=1;md.push('умеренное увеличение ИОЛП (малый)')}if((lvmi>=(sex==='m'?115:95))||rwt>0.42||wall>=12){M=1;md.push('гипертрофия/концентрическое ремоделирование (малый)')}}let maj=marker==='nt'?(rh==='af'?660:220):(rh==='af'?240:80),min=marker==='nt'?(rh==='af'?365:125):(rh==='af'?105:35);if(np>maj){B=2;bd.push((marker==='nt'?'NT-proBNP':'BNP')+' выше большого порога')}else if(np>=min){B=1;bd.push((marker==='nt'?'NT-proBNP':'BNP')+' в диапазоне малого критерия')}let s=F+M+B,cat=s>=5?'HFpEF высоко вероятна / диагностический диапазон':s<=1?'HFpEF маловероятна':'Промежуточная вероятность — требуется функциональное тестирование';peRes.innerHTML='<b>HFA-PEFF: '+s+'/6 — '+cat+'</b><br><br><b>Функциональный домен: '+F+'/2</b> — '+(fd.join('; ')||'критерии не выявлены/данных недостаточно')+'<br><b>Морфологический домен: '+M+'/2</b> — '+(md.join('; ')||'критерии не выявлены/данных недостаточно')+'<br><b>Биомаркерный домен: '+B+'/2</b> — '+(bd.join('; ')||'критерии не выявлены/данных недостаточно')+(s>=2&&s<=4?'<br><br><b>Следующий шаг:</b> диастолическая стресс-ЭхоКГ и/или инвазивная оценка гемодинамики при нагрузке.':'')}'''
          s=s[:f0]+fn+s[f1:]
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'CardioShort Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add calculators.html
          git commit -m 'Expand HFA-PEFF calculator with full clinical criteria'
          git push
