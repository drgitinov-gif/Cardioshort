name: Fix VTE trials back button
on:
  push:
    paths:
      - '.github/workflows/fix-vte-back.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix back button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('vte-prophylaxis-trials.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="anticoagulation.html">← Антикоагулянтная терапия</a>', 'href="index.html">← На главную</a>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vte-prophylaxis-trials.html
          if ! git diff --cached --quiet; then
            git commit -m "Point VTE trials back button to homepage"
            git push
          fi
