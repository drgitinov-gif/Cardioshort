name: Fix VTE ad binary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-vte-ad-direct.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore real JPEG and refresh homepage
        run: |
          base64 -d assets/vte-ad-slide1-web.bin > assets/vte-ad-slide1-web.jpg
          test "$(wc -c < assets/vte-ad-slide1-web.jpg)" -eq 8340
          file assets/vte-ad-slide1-web.jpg | grep -q 'JPEG image data'
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'assets/vte-ad-slide1-web\.jpg(?:\?v=[^"<> ]+)?',
                     'assets/vte-ad-slide1-web.jpg?v=20260823-2040', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixed advertisement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vte-ad-slide1-web.jpg index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix broken VTE advertisement image'
          git push
