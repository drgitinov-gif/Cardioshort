name: Use high-quality Eliquis VTE banner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-vte-ad-direct.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point homepage to supplied high-quality image
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'assets/vte-ad-slide1-web\.jpg(?:\?v=[^"<> ]+)?',
                     'assets/eliquis-vte-ad-1600.jpg?v=20260823-2054', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use high-quality Eliquis VTE banner on homepage'
          git push
