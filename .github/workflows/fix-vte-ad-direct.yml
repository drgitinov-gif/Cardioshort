name: Fix VTE ad direct image
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-vte-ad-direct.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point homepage ad directly to JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('vte-ad-slide1.svg', 'assets/vte-ad-slide1-web.jpg?v=20260823-2015')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use VTE ad JPEG directly on homepage'
          git push
