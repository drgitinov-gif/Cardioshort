name: SEO eGFR calculators
on:
  push:
    paths:
      - '.github/workflows/seo-egfr-calculators.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update calculators SEO metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('calculators.html')
          s = p.read_text(encoding='utf-8')
          old = '<title>Калькуляторы в кардиологии — CardioShort</title>'
          new = '<title>Медицинские калькуляторы: СКФ, CKD-EPI, GRACE, CHA₂DS₂-VASc, PESI — CardioShort</title><meta name="description" content="Расчёт СКФ онлайн по CKD-EPI 2021 и MDRD, клиренс креатинина по Cockcroft–Gault, а также GRACE, CHA₂DS₂-VASc, HAS-BLED, PESI, PRECISE-DAPT и другие кардиологические калькуляторы."><meta name="robots" content="index,follow"><link rel="canonical" href="https://cardioshort.ru/calculators.html">'
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('Expected title not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculators.html
          git diff --cached --quiet || git commit -m "Улучшить SEO калькулятора СКФ"
          git push
